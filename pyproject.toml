[project]
name = "goalclaw"
version = "0.0.1"
description = "GoalClaw — the goal-layer planner: durable goals advanced across heartbeat wakeups, dispatched to engines (devclaw for code)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3",
    "httpx>=0.27",
    "pyyaml>=6",
    # The plan step's cognition — the supported programmatic interface to Claude
    # Code, on the Pro/Max OAuth session (no API key). Replaces `claude --print`.
    "claude-agent-sdk>=0.2",
]

[project.scripts]
goalclaw = "goalclaw.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goalclaw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
